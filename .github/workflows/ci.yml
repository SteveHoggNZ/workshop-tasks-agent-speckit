name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore CRUDTasksWithAgent.slnx

      - name: Build
        run: dotnet build CRUDTasksWithAgent.slnx --no-restore

      - name: Test
        run: dotnet test CRUDTasksWithAgent.slnx --no-build

      - name: Lint baseline check
        run: node scripts/lint-count.mjs --check
